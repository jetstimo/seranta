name: Release
# Rilis baru: naikkan "version" dan "changelog" di seranta/metadata.txt, commit, lalu buat tag yang sama, mis.
#   git tag v3.4.1 && git push origin v3.4.1
# Rilis resmi (3.15.9+) ditandatangani di laptop dan zip-nya dilampirkan manual: saat tag didorong workflow ini HANYA
# memeriksa (versi, uji, validasi ZIP) dan TIDAK mengunggah apa pun, supaya zip bertanda tangan tidak ditimpa
# (3.15.7: zip rilis tertimpa zip buatan CI). Unggah otomatis hanya lewat tombol "Run workflow" (workflow_dispatch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # rilis dari tombol "Run workflow" (tag dibuat dari versi di metadata.txt)
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OSGEO_USER: ${{ secrets.OSGEO_USER }}
      OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match metadata version
        id: ver
        run: |
          V=$(grep -m1 '^version=' seranta/metadata.txt | cut -d= -f2 | tr -d '\r ')
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != metadata v$V"; exit 1; }
          fi
      - name: Tests
        run: |
          python seranta/tests/test_qc_core.py
          python seranta/tests/test_uat_paket.py
          python seranta/tests/test_v35.py
          python seranta/tests/test_v39.py
          python seranta/tests/test_v380.py
          python seranta/tests/test_v310.py seranta
          python seranta/tests/test_v311.py seranta
          python seranta/tests/test_v313.py
          python seranta/tests/test_v314.py
          python seranta/tests/test_v3141.py
          python seranta/tests/test_v3150.py
          python seranta/tests/test_v351.py
          python seranta/tests/test_v353.py
      - name: Brand-neutral texts
        env:
          BRAND_DENYLIST: ${{ secrets.BRAND_DENYLIST }}
        run: python scripts/check_neutral.py seranta
      - name: Build ZIP
        run: python scripts/release.py seranta dist --strict
      - name: GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Seranta ${{ steps.ver.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
      - name: Upload to plugins.qgis.org
        if: ${{ github.event_name == 'workflow_dispatch' && env.OSGEO_USER != '' }}
        run: python scripts/upload_plugin.py dist/seranta.*.zip
