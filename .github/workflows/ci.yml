name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and acceptance tests (pure Python, no QGIS needed)
        run: |
          python seranta/tests/test_qc_core.py
          python seranta/tests/test_uat_paket.py
          python seranta/tests/test_v35.py
      - name: Security scan (Bandit)
        run: |
          pip install bandit
          bandit -q -r seranta -x seranta/tests -ll
      - name: Brand-neutral texts
        env:
          BRAND_DENYLIST: ${{ secrets.BRAND_DENYLIST }}
        run: python scripts/check_neutral.py seranta
      - name: Build and validate plugin ZIP
        run: python scripts/release.py seranta dist --strict
      - uses: actions/upload-artifact@v4
        with:
          name: seranta-zip
          path: dist/*.zip
