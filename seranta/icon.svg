<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Seranta logo | (c) 2026 Joseph Edward Timothy Siahaan. Seranta(TM) -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06294F"/>
      <stop offset="1" stop-color="#0A6F86"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.45" stop-color="#5CF2E8"/>
      <stop offset="1" stop-color="#7FD8FF"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7B0"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sea)"/>
  <!-- garis cakrawala tipis: lautan Nusantara -->
  <path d="M36 206 Q128 194 220 206" stroke="#7FD8FF" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round"/>
  <!-- helai serat berbentuk S -->
  <path id="s" d="M182 62 C 120 34, 52 70, 92 110 C 120 136, 176 124, 168 166 C 160 206, 102 214, 70 192"
        fill="none" stroke="#5CF2E8" stroke-width="26" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>
  <path d="M182 62 C 120 34, 52 70, 92 110 C 120 136, 176 124, 168 166 C 160 206, 102 214, 70 192"
        fill="none" stroke="url(#light)" stroke-width="18" stroke-linecap="round"/>
  <path d="M182 62 C 120 34, 52 70, 92 110 C 120 136, 176 124, 168 166 C 160 206, 102 214, 70 192"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- tiga titik: FDT (sumber, fajar), FAT, rumah -->
  <circle cx="182" cy="62" r="17" fill="url(#sun)" stroke="#06294F" stroke-width="4"/>
  <circle cx="129" cy="128" r="11" fill="#FFFFFF" stroke="#06294F" stroke-width="4"/>
  <circle cx="70" cy="192" r="13" fill="#5CF2E8" stroke="#06294F" stroke-width="4"/>
</svg>
